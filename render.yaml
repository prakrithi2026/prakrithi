# Render Blueprint Specification
# Deploys: PostgreSQL Database, Django Backend (Web Service), and React Frontend (Static Site)
services:
  - type: web
    name: prakrithi-backend
    env: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --no-input && python populate.py && gunicorn backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prakrithi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
        placeholder: "Enter Razorpay Key ID (optional)"
      - key: RAZORPAY_KEY_SECRET
        sync: false
        placeholder: "Enter Razorpay Key Secret (optional)"
      - key: EMAIL_HOST_USER
        sync: false
        placeholder: "Enter Gmail address (e.g. sale.prakrithi@gmail.com)"
      - key: EMAIL_HOST_PASSWORD
        sync: false
        placeholder: "Enter Google App Password (16 characters)"
      - key: RESEND_API_KEY
        sync: false
        placeholder: "Enter Resend API Key (re_..., for free HTTPS emails on Render)"


  - type: static
    name: prakrithi-frontend
    env: static
    rootDir: frondend
    buildCommand: npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://prakrithi.onrender.com/api
        placeholder: "Enter Backend URL + /api (e.g., https://prakrithi-backend.onrender.com/api)"

databases:
  - name: prakrithi-db
    databaseName: prakrithi
    user: postgres
