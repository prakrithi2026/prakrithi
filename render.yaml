# Render Blueprint Specification
# Deploys: PostgreSQL Database, Django Backend (Web Service), and React Frontend (Static Site)
services:
  - type: web
    name: prakrithi-backend
    env: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prakrithi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
        placeholder: "Enter Razorpay Key ID (optional)"
      - key: RAZORPAY_KEY_SECRET
        sync: false
        placeholder: "Enter Razorpay Key Secret (optional)"

  - type: static
    name: prakrithi-frontend
    env: static
    rootDir: frondend
    buildCommand: npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://prakrithi-backend.onrender.com/api
        placeholder: "Enter Backend URL + /api (e.g., https://prakrithi-backend.onrender.com/api)"

databases:
  - name: prakrithi-db
    databaseName: prakrithi
    user: postgres
